edgeAgent:
  replicaCount: 1
  image:
    repository: edge-agent
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # URL of the cloud telemetry API reachable from the edge device.
  telemetryUrl: http://telemetry-api:8080/telemetry
  deviceId: ""
  intervalSeconds: 30
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

imageRegistry: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
