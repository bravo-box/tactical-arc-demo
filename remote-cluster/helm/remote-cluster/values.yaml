edgeAgent:
  replicaCount: 1
  image:
    repository: edge-agent
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # Placeholder: must be overridden with the URL of the cloud telemetry API as
  # reachable from the edge device (see scripts/deploy.sh --telemetry-url).
  telemetryUrl: http://telemetry-api.example.invalid:8080/telemetry
  deviceId: ""
  intervalSeconds: 30
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

imageRegistry: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
