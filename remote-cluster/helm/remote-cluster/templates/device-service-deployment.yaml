apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "remote-cluster.fullname" . }}-device-service
  labels:
    {{- include "remote-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: device-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "remote-cluster.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: device-service
  template:
    metadata:
      labels:
        {{- include "remote-cluster.labels" . | nindent 8 }}
        app.kubernetes.io/component: device-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: device-service
          image: {{ if .Values.imageRegistry }}{{ .Values.imageRegistry }}/{{ end }}{{ .Values.deviceService.image.repository }}:{{ .Values.deviceService.image.tag }}
          imagePullPolicy: {{ .Values.deviceService.image.pullPolicy }}
          env:
            - name: MQTT_HOST
              value: {{ include "remote-cluster.fullname" . }}-mqtt
            - name: MQTT_PORT
              value: {{ .Values.mqtt.port | quote }}
          volumeMounts:
            - name: device-info
              mountPath: /etc/device-service/device.json
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.deviceService.resources | nindent 12 }}
      volumes:
        - name: device-info
          hostPath:
            path: {{ required "deviceService.configHostPath is required" .Values.deviceService.configHostPath }}
            type: File
