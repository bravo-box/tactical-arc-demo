<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device heartbeat monitor</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0b1220; color: #e5edf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { padding: 20px 24px; border-bottom: 1px solid #243249; background: #111b2d; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; min-height: calc(100vh - 65px); }
    aside { border-right: 1px solid #243249; padding: 16px; }
    #devices { display: grid; gap: 8px; }
    button { width: 100%; border: 1px solid #30415e; border-radius: 8px; padding: 12px; color: inherit; background: #162238; text-align: left; cursor: pointer; }
    button:hover, button.selected { border-color: #60a5fa; background: #1d3150; }
    .device-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .active { background: #34d399; }
    .inactive { background: #64748b; }
    section { padding: 24px; overflow: auto; }
    .details { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card { border: 1px solid #243249; border-radius: 10px; padding: 14px; background: #111b2d; }
    .label { color: #93a4bc; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
    .value { margin-top: 6px; font-weight: 650; overflow-wrap: anywhere; }
    .status-Green { color: #34d399; } .status-Yellow { color: #fbbf24; } .status-Red { color: #fb7185; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .take-picture { width: auto; background: #1d4ed8; border-color: #60a5fa; font-weight: 700; }
    .take-picture:disabled { cursor: wait; opacity: .65; }
    .error { color: #fb7185; }
    details { margin: 0 0 24px; border: 1px solid #243249; border-radius: 10px; background: #111b2d; }
    summary { padding: 14px; cursor: pointer; font-weight: 700; }
    details table { margin: 0 14px 14px; width: calc(100% - 28px); }
    .request-status { font-weight: 700; }
    .request-status.Queued { color: #fbbf24; }
    .request-status.Uploaded { color: #34d399; }
    .request-image { width: auto; padding: 4px 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #243249; text-align: left; }
    th { color: #93a4bc; font-size: .75rem; text-transform: uppercase; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 12px; }
    .image-tile { padding: 0; overflow: hidden; }
    .image-tile img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #050a13; }
    .image-tile span { display: block; padding: 10px 12px; }
    dialog { width: min(960px, calc(100% - 32px)); max-height: 92vh; padding: 0; border: 1px solid #30415e; border-radius: 12px; background: #111b2d; color: inherit; }
    dialog::backdrop { background: rgb(0 0 0 / .8); }
    dialog > img { display: block; width: 100%; max-height: 65vh; object-fit: contain; background: #050a13; }
    .modal-details { padding: 20px; }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 40px; padding: 8px; text-align: center; border-radius: 50%; background: rgb(11 18 32 / .9); font-size: 1.2rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; }
    dt { color: #93a4bc; }
    dd { margin: 0; overflow-wrap: anywhere; }
    .empty { color: #93a4bc; padding: 28px 0; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid #243249; }
      .details { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header><h1>Device heartbeat monitor</h1></header>
  <main>
    <aside><div id="devices"><div class="empty">Waiting for devices...</div></div></aside>
    <section id="content"><div class="empty">Select a device to see its heartbeat history.</div></section>
  </main>
  <dialog id="image-dialog">
    <button class="modal-close" aria-label="Close image">&times;</button>
    <img id="full-image" alt="">
    <div class="modal-details">
      <h2 id="image-title"></h2>
      <dl id="image-metadata"></dl>
    </div>
  </dialog>
  <script>
    const devicesElement = document.querySelector("#devices");
    const contentElement = document.querySelector("#content");
    const imageDialog = document.querySelector("#image-dialog");
    const fullImage = document.querySelector("#full-image");
    const imageTitle = document.querySelector("#image-title");
    const imageMetadata = document.querySelector("#image-metadata");
    let selectedDevice = null;
    let imageCaptureEnabled = false;

    const escapeHtml = value => String(value).replace(/[&<>"']/g, char => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]
    ));
    const formatDate = value => new Date(value).toLocaleString();
    const metadataFields = [
      ["Device", "deviceId"],
      ["Hostname", "hostname"],
      ["Architecture", "architecture"],
      ["Captured", image => formatDate(image.capturedAt)],
      ["Uploaded", image => formatDate(image.uploadedAt)],
      ["Dimensions", image => `${image.width} × ${image.height}`],
      ["File", "fileName"],
      ["Image ID", "id"],
      ["Correlation ID", "correlationId"]
    ];

    function openImage(image) {
      fullImage.src = `/api/images/${encodeURIComponent(image.id)}/content`;
      fullImage.alt = `Capture from ${image.deviceId} at ${image.capturedAt}`;
      imageTitle.textContent = image.fileName;
      imageMetadata.innerHTML = metadataFields.map(([label, accessor]) => {
        const value = typeof accessor === "function" ? accessor(image) : image[accessor];
        return `<dt>${escapeHtml(label)}</dt><dd>${escapeHtml(value)}</dd>`;
      }).join("");
      imageDialog.showModal();
    }

    async function refreshDevices() {
      const response = await fetch("/api/devices");
      if (!response.ok) throw new Error("Unable to load devices");
      const devices = await response.json();
      devicesElement.innerHTML = devices.length ? devices.map(device => `
        <button data-device="${escapeHtml(device.deviceName)}" class="${device.deviceName === selectedDevice ? "selected" : ""}">
          <div class="device-row">
            <span><span class="dot ${device.isActive ? "active" : "inactive"}"></span>${escapeHtml(device.deviceName)}</span>
            <span class="status-${device.healthStatus}">${escapeHtml(device.healthStatus)}</span>
          </div>
        </button>`).join("") : '<div class="empty">Waiting for devices...</div>';
      document.querySelectorAll("[data-device]").forEach(button =>
        button.addEventListener("click", () => selectDevice(button.dataset.device)));
      if (selectedDevice) await loadDetails(selectedDevice);
    }

    async function selectDevice(deviceName) {
      selectedDevice = deviceName;
      await refreshDevices();
    }

    async function loadDetails(deviceName) {
      const encodedName = encodeURIComponent(deviceName);
      const responses = [
        fetch(`/api/devices/${encodedName}`),
        fetch(`/api/devices/${encodedName}/images`)
      ];
      if (imageCaptureEnabled) {
        responses.push(fetch(`/api/devices/${encodedName}/capture-requests`));
      }
      const [deviceResponse, imageResponse, requestsResponse] = await Promise.all(responses);
      if (!deviceResponse.ok || !imageResponse.ok || (requestsResponse && !requestsResponse.ok)) return;
      const device = await deviceResponse.json();
      const images = await imageResponse.json();
      const requests = requestsResponse ? await requestsResponse.json() : [];
      const requestsPanelOpen = document.querySelector("#capture-requests")?.open ?? false;
      const capturePanel = imageCaptureEnabled ? `
        <div class="toolbar">
          <button id="take-picture" class="take-picture" type="button">Take picture</button>
          <span id="capture-error" class="error" role="alert"></span>
        </div>
        <details id="capture-requests" ${requestsPanelOpen ? "open" : ""}>
          <summary>Capture requests (${requests.length})</summary>
          ${requests.length ? `<table><thead><tr><th>Requested</th><th>Correlation ID</th><th>Status</th><th>Completed</th><th>Image</th></tr></thead>
          <tbody>${requests.map(request => `<tr>
            <td>${formatDate(request.requestedAt)}</td>
            <td>${escapeHtml(request.correlationId)}</td>
            <td class="request-status ${escapeHtml(request.status)}">${escapeHtml(request.status)}</td>
            <td>${request.completedAt ? formatDate(request.completedAt) : "—"}</td>
            <td>${request.imageId ? `<button class="request-image" data-request-image="${escapeHtml(request.imageId)}">${escapeHtml(request.imageId)}</button>` : "—"}</td>
          </tr>`).join("")}</tbody></table>` : '<div class="empty">No capture requests have been sent for this device.</div>'}
        </details>` : "";
      contentElement.innerHTML = `
        <div class="details">
          <div class="card"><div class="label">Device</div><div class="value">${escapeHtml(device.deviceName)}</div></div>
          <div class="card"><div class="label">IP address</div><div class="value">${escapeHtml(device.ipAddress)}</div></div>
          <div class="card"><div class="label">Health</div><div class="value status-${device.healthStatus}">${escapeHtml(device.healthStatus)}</div></div>
          <div class="card"><div class="label">Last seen</div><div class="value">${formatDate(device.lastSeen)}</div></div>
        </div>
        ${capturePanel}
        <h2>Heartbeat log</h2>
        <table><thead><tr><th>Received</th><th>Device timestamp</th><th>IP address</th><th>Status</th></tr></thead>
        <tbody>${device.heartbeats.map(heartbeat => `<tr>
          <td>${formatDate(heartbeat.receivedAt)}</td><td>${formatDate(heartbeat.timestamp)}</td>
          <td>${escapeHtml(heartbeat.ipAddress)}</td>
          <td class="status-${heartbeat.healthStatus}">${escapeHtml(heartbeat.healthStatus)}</td>
        </tr>`).join("")}</tbody></table>
        <h2>Images</h2>
        ${images.length ? `<div class="gallery">${images.map(image => `
          <button class="image-tile" data-image-id="${escapeHtml(image.id)}">
            <img src="/api/images/${encodeURIComponent(image.id)}/content" alt="Capture from ${escapeHtml(image.deviceId)}" loading="lazy">
            <span>${formatDate(image.capturedAt)}</span>
          </button>`).join("")}</div>` : '<div class="empty">No images have been uploaded for this device.</div>'}`;
      contentElement.querySelectorAll("[data-image-id]").forEach(button => {
        const image = images.find(candidate => candidate.id === button.dataset.imageId);
        if (image) button.addEventListener("click", () => openImage(image));
      });
      contentElement.querySelectorAll("[data-request-image]").forEach(button => {
        const image = images.find(candidate => candidate.id === button.dataset.requestImage);
        if (image) button.addEventListener("click", () => openImage(image));
      });
      document.querySelector("#take-picture")?.addEventListener("click", async event => {
        const button = event.currentTarget;
        const error = document.querySelector("#capture-error");
        button.disabled = true;
        button.textContent = "Sending…";
        error.textContent = "";
        try {
          const response = await fetch(`/api/devices/${encodedName}/capture-requests`, { method: "POST" });
          if (!response.ok) {
            const body = await response.json().catch(() => ({}));
            throw new Error(body.error || "Could not queue capture request");
          }
          await loadDetails(deviceName);
          document.querySelector("#capture-requests").open = true;
        } catch (captureError) {
          error.textContent = captureError.message;
          button.disabled = false;
          button.textContent = "Take picture";
        }
      });
    }

    document.querySelector(".modal-close").addEventListener("click", () => imageDialog.close());
    imageDialog.addEventListener("click", event => {
      if (event.target === imageDialog) imageDialog.close();
    });
    async function initialize() {
      const response = await fetch("/api/features");
      if (!response.ok) throw new Error("Unable to load application features");
      imageCaptureEnabled = (await response.json()).imagesEnabled;
      await refreshDevices();
    }

    initialize().catch(error => contentElement.textContent = error.message);
    setInterval(() => refreshDevices().catch(console.error), 5000);
  </script>
</body>
</html>
