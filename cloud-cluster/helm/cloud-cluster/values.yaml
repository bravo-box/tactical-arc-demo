telemetryApi:
  replicaCount: 1
  image:
    repository: telemetry-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  serviceBus:
    topic: edge-heartbeat
    subscription: heartbeat-monitor
    fullyQualifiedNamespace: ""
    existingSecret: heartbeat-monitor-servicebus
    connectionStringKey: connection-string
  workloadIdentity:
    clientId: ""
  monitor:
    activeDeviceTimeoutSeconds: 30
    maxHeartbeatsPerDevice: 100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

imageRegistry: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
