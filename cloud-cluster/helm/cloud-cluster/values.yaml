telemetryApi:
  replicaCount: 1
  image:
    repository: telemetry-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  serviceBus:
    topic: edge-heartbeat
    subscription: heartbeat-monitor
    fullyQualifiedNamespace: ""
    existingSecret: heartbeat-monitor-servicebus
    connectionStringKey: connection-string
  imageServiceBus:
    enabled: false
    topic: image-upload
    subscription: image-web
    fullyQualifiedNamespace: ""
    existingSecret: ""
    connectionStringKey: connection-string
  cameraCommands:
    queue: take-picture
    fullyQualifiedNamespace: ""
    existingSecret: ""
    connectionStringKey: connection-string
  locationCommands:
    enabled: true
    queue: update-location
    fullyQualifiedNamespace: ""
    existingSecret: ""
    connectionStringKey: connection-string
  storage:
    container: device-images
    accountUrl: ""
    existingSecret: ""
    connectionStringKey: connection-string
  workloadIdentity:
    clientId: ""
    serviceAccountName: telemetry-api
  cosmos:
    endpoint: ""
    database: telemetry
    container: devices
  monitor:
    activeDeviceTimeoutSeconds: 30
    maxHeartbeatsPerDevice: 100
    maxImagesPerDevice: 100
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 384Mi

imageRegistry: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
