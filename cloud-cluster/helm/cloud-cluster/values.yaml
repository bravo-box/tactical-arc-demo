telemetryApi:
  replicaCount: 2
  image:
    repository: telemetry-api
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

imageRegistry: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
