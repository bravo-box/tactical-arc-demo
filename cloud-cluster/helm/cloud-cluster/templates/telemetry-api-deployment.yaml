apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-cluster.fullname" . }}-telemetry-api
  labels:
    {{- include "cloud-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-api
spec:
  replicas: {{ .Values.telemetryApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloud-cluster.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: telemetry-api
  template:
    metadata:
      annotations:
        checksum/servicebus: {{ .Values.telemetryApi.serviceBus | toJson | sha256sum }}
      labels:
        {{- include "cloud-cluster.labels" . | nindent 8 }}
        app.kubernetes.io/component: telemetry-api
        {{- if .Values.telemetryApi.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "cloud-cluster.fullname" . }}-telemetry-api
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: telemetry-api
          image: {{ include "cloud-cluster.image" . }}
          imagePullPolicy: {{ .Values.telemetryApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ServiceBus__Topic
              value: {{ .Values.telemetryApi.serviceBus.topic | quote }}
            - name: ServiceBus__Subscription
              value: {{ .Values.telemetryApi.serviceBus.subscription | quote }}
            - name: ServiceBus__FullyQualifiedNamespace
              value: {{ .Values.telemetryApi.serviceBus.fullyQualifiedNamespace | quote }}
            - name: Monitor__ActiveDeviceTimeoutSeconds
              value: {{ .Values.telemetryApi.monitor.activeDeviceTimeoutSeconds | quote }}
            - name: Monitor__MaxHeartbeatsPerDevice
              value: {{ .Values.telemetryApi.monitor.maxHeartbeatsPerDevice | quote }}
            {{- if .Values.telemetryApi.serviceBus.existingSecret }}
            - name: ServiceBus__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetryApi.serviceBus.existingSecret }}
                  key: {{ .Values.telemetryApi.serviceBus.connectionStringKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.telemetryApi.resources | nindent 12 }}
