apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-cluster.fullname" . }}-telemetry-api
  labels:
    {{- include "cloud-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-api
spec:
  replicas: {{ .Values.telemetryApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cloud-cluster.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: telemetry-api
  template:
    metadata:
      labels:
        {{- include "cloud-cluster.labels" . | nindent 8 }}
        app.kubernetes.io/component: telemetry-api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: telemetry-api
          image: {{ include "cloud-cluster.image" . }}
          imagePullPolicy: {{ .Values.telemetryApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.telemetryApi.resources | nindent 12 }}
