name: Python application tests

on:
  workflow_call:
    inputs:
      app:
        description: Application directory under remote-cluster/apps
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: remote-cluster/apps/${{ inputs.app }}/requirements.txt
      - name: Install dependencies
        working-directory: remote-cluster/apps/${{ inputs.app }}
        run: pip install --requirement requirements.txt
      - name: Run tests
        working-directory: remote-cluster/apps/${{ inputs.app }}
        run: python -m unittest discover --verbose
