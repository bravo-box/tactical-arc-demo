name: Test applications

on:
  pull_request:
    paths:
      - "cloud-cluster/apps/**"
      - "remote-cluster/apps/**"
      - ".github/workflows/apps-pr.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: remote-cluster/apps/edge-heartbeat/requirements.txt
      - name: Install edge dependencies
        run: pip install --requirement remote-cluster/apps/edge-heartbeat/requirements.txt
      - name: Test edge heartbeat
        working-directory: remote-cluster/apps/edge-heartbeat
        run: python -m unittest --verbose
      - name: Test heartbeat monitor
        run: dotnet test cloud-cluster/apps/telemetry-api.Tests/HeartbeatMonitor.Tests.csproj --configuration Release
