name: Application test gate

on:
  pull_request:
    paths:
      - "cloud-cluster/apps/**"
      - "remote-cluster/apps/**"
      - ".github/workflows/apps-pr.yml"

concurrency:
  group: application-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge-tests:
    name: Edge tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app:
          - edge-heartbeat
          - device-service
          - location-service
          - camera-capture
          - image-uploader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: remote-cluster/apps/${{ matrix.app }}/requirements.txt
      - name: Install dependencies
        working-directory: remote-cluster/apps/${{ matrix.app }}
        run: pip install --requirement requirements.txt
      - name: Run tests
        working-directory: remote-cluster/apps/${{ matrix.app }}
        run: python -m unittest discover --verbose

  telemetry-tests:
    name: Telemetry API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test heartbeat monitor
        run: >-
          dotnet test
          cloud-cluster/apps/telemetry-api.Tests/HeartbeatMonitor.Tests.csproj
          --configuration Release
          --nologo

  required:
    name: Required application tests
    if: always()
    needs:
      - edge-tests
      - telemetry-tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify all application tests passed
        env:
          EDGE_RESULT: ${{ needs.edge-tests.result }}
          TELEMETRY_RESULT: ${{ needs.telemetry-tests.result }}
        run: |
          test "${EDGE_RESULT}" = "success"
          test "${TELEMETRY_RESULT}" = "success"
